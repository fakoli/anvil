site_name: Anvil
site_description: >-
  The system of record for agent teams — durable, evidence-gated,
  lease-coordinated state for multi-agent software work.
# Canonical site: https://anvilstate.com/, published from main by a separate
# deploy pipeline. GitHub Pages is retired; CI's "docs build" job checks the build.
site_url: https://anvilstate.com/
repo_url: https://github.com/fakoli/anvil
repo_name: fakoli/anvil
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  # Template overrides: overrides/main.html (fonts, social meta) and
  # overrides/home.html (the landing page shell used by docs/index.md).
  custom_dir: overrides
  logo: img/logo.svg
  favicon: img/favicon.png
  # Fonts (IBM Plex Sans / Mono) are loaded in overrides/main.html so the
  # exact weights are under our control; the stack lives in stylesheets/anvil.css.
  font: false
  # "custom" hands the palette to docs/stylesheets/anvil.css, which defines
  # every colour token for both schemes.
  # Three states: follow the system, then explicit light, then explicit dark.
  # Without the first entry the site stops following the OS after one visit.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/anvil.css

# Keyboard access to the mobile drawer and search toggles (the theme ships
# them as unfocusable <label> elements), and aria-current on the active page.
extra_javascript:
  - javascripts/a11y.js

# Search ranking: the user guides outrank design records and performance
# notes. See the module docstring. (Maintainer material never reaches the
# index; exclude_docs below keeps it out of the build.)
hooks:
  - scripts/mkdocs_hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fakoli/anvil
      name: Anvil on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/anvil-state/
      name: anvil-state on PyPI

copyright: MIT licensed · built in the open by Fakoli and contributors

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

plugins:
  - search

# Links into the source tree use absolute GitHub URLs (valid on GitHub AND
# on the site); links between docs stay relative. CI builds with --strict,
# so a broken relative link or anchor fails the build (plan item D5, done).
validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: warn

# Maintainer working material stays in the repository but is NOT built into the
# site: backlogs, plans, specs, research, archives, incident notes and the
# positioning source text. `not_in_nav` only hides a page from the menu (it is
# still built, served and listed in sitemap.xml); `exclude_docs` keeps the file
# out of the build altogether. The files are left in place because tests,
# source docstrings and agent prompts cite these paths. Link to them from a
# published page with an absolute GitHub URL, never a relative one.
# tests/test_site_landing.py pins this list.
exclude_docs: |
  /archive/
  /backlog/
  /findings/
  /plans/
  /postmortems/
  /research/
  /specs/
  /_positioning.md
  /critic-false-pass-baseline.md
  /live-tests.md
  /tech-debt-backlog.md
  /decisions/wf3-format.md
  /design/concurrency-and-approval-research.md
  /design/concurrency-source-findings.md
  /design/spec-kit-concurrency-comparison.md
  /reference/codex.md
  /requirements.txt

# Top-level entries render as tabs (navigation.tabs); keep the labels short.
# Five tabs: three for a user doing a task, one that explains how Anvil works,
# one about the project itself. The landing page (index.md) is reached from the
# logo, so it has no tab of its own.
nav:
  - Get started:
      - Getting started: how-to/getting-started.md
      - Where state lives: how-to/state-location.md
      - Authoring a PRD: how-to/authoring-a-prd.md
      - Glossary: glossary.md
  - Guides:
      - The core loop:
          - Claiming & shipping a task: how-to/claiming-and-shipping-a-task.md
          - Driving the anvil loop: how-to/drive-the-anvil-loop.md
          - Long-running delivery: how-to/long-running-delivery.md
      - Evidence & proof:
          - Verification profiles: how-to/verification-profiles.md
          - Recorded attempt views: how-to/attempt-views.md
          - Attesting external progress: how-to/attesting-external-progress.md
      - Coordinating agents:
          - Coordinating a milestone bundle: how-to/coordinating-a-bundle.md
          - Concurrent execution journeys: how-to/concurrent-execution-journeys.md
      - Harnesses:
          - Using anvil on any harness: how-to/using-anvil-on-any-harness.md
          - Execute in the current or local-model harness: how-to/execute-in-your-harness.md
          - Run a task with a configured harness: how-to/harness-execution.md
      - Interfaces & sync:
          - Web interface: how-to/web-interface.md
          - Syncing with GitHub: how-to/syncing-with-github.md
          - Optional Jev advice: how-to/optional-jev.md
  - Reference:
      - CLI: cli-reference.md
      - MCP server: mcp.md
      - PRD template & schema: prd-template.md
      - Provider read contracts: contracts/provider-reads-v1.md
      - Agents: agents-reference.md
      - Skills: skills-reference.md
      - Hooks: hooks-reference.md
      - LLM integration: llm.md
      - Evidence buffer: evidence-buffer.md
      - GitHub sync: github-sync.md
      - Migrations: migrations.md
  - Concepts:
      - Architecture: architecture.md
      - Design rationale: design.md
      - Performance notes:
          - Ledger latency: design/ledger-latency-validation.md
          - Snapshot capture latency: design/snapshot-capture-latency.md
          - Execution and proof qualification: design/execution-scale-validation.md
  - Project:
      - Roadmap: roadmap.md
      - FAQ: faq.md
      - Contributing:
          - Contributing: contributing.md
          - Writing a sync provider: sync-providers.md
          - Model strategy: model-strategy.md
          - Context budget: context-budget.md
          - Behavior-first PRD readiness: decisions/2026-07-19-behavioral-readiness.md
