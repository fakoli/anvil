site_name: Anvil
site_description: >-
  The system of record for agent teams — durable, evidence-gated,
  lease-coordinated state for multi-agent software work.
# Canonical site: GitHub Pages (auto-deployed by .github/workflows/docs-pages.yml
# on every docs push to main). Read the Docs also builds via .readthedocs.yaml.
site_url: https://fakoli.github.io/anvil/
repo_url: https://github.com/fakoli/anvil
repo_name: fakoli/anvil
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  # Template overrides: overrides/main.html (fonts, social meta) and
  # overrides/home.html (the landing page shell used by docs/index.md).
  custom_dir: overrides
  logo: img/logo.svg
  favicon: img/favicon.png
  # Fonts (IBM Plex Sans / Mono) are loaded in overrides/main.html so the
  # exact weights are under our control; the stack lives in stylesheets/anvil.css.
  font: false
  # "custom" hands the palette to docs/stylesheets/anvil.css, which defines
  # every colour token for both schemes.
  # Three states: follow the system, then explicit light, then explicit dark.
  # Without the first entry the site stops following the OS after one visit.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/anvil.css

# Keyboard access to the mobile drawer and search toggles (the theme ships
# them as unfocusable <label> elements), and aria-current on the active page.
extra_javascript:
  - javascripts/a11y.js

# Search scope: keeps archived plans, research and backlogs from outranking
# the user guides. See the module docstring.
hooks:
  - scripts/mkdocs_hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fakoli/anvil
      name: Anvil on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/anvil-state/
      name: anvil-state on PyPI

copyright: MIT licensed · built in the open by Fakoli and contributors

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

plugins:
  - search

# Links into the source tree use absolute GitHub URLs (valid on GitHub AND
# on the site); links between docs stay relative. CI builds with --strict,
# so a broken relative link or anchor fails the build (plan item D5, done).
validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: warn

# In the repo but intentionally NOT in the site nav:
#   _positioning.md    — internal source-of-truth, marked "not part of
#                        user-facing docs nav" in its own header
#   backlog/*.prd.md   — machine-ingested PRD data files, not prose
#   research/*         — competitive-intelligence / market research notes;
#                        kept in repo for provenance, not published
#   archive/*          — superseded plans/backlogs/audits; historical only,
#                        see archive/README.md
#   plans/2026-07-07-docs-assessment.md — this restructure's own working
#                        doc; maintainer-only, not part of the site
not_in_nav: |
  _positioning.md
  backlog/anvil-backlog.prd.md
  backlog/multi-prd-revisable.prd.md
  research/2026-06-19-backlog-management-research.md
  research/2026-06-19-maximize-anvil-codex.md
  research/2026-06-19-maximize-anvil-openclaw.md
  research/2026-06-20-agent-fleet-pull-market-landscape.md
  research/2026-06-20-competitive-analysis-agent-state-tools.md
  research/agent-workflow-formats.md
  research/competitor-issue-analysis.md
  research/intent-driven-development-landscape.md
  research/spec-driven-development-synthesis.md
  research/2026-10-08-issue-246-long-running-delivery.md
  archive/README.md
  archive/BUILD-REPORT.md
  archive/phase-9-backlog.md
  archive/phase-11-backlog.md
  archive/2026-05-25-phase-8-sync.md
  archive/2026-05-25-phase-9.md
  archive/2026-05-26-phase-10-plugin-audit.md
  archive/2026-06-01-sl1-rr-1-event-sourcing-write-path.md
  archive/2026-05-26-plugin-audit.md
  plans/2026-07-07-docs-assessment.md
  plans/2026-07-07-retro-opps-prd.md
  plans/2026-10-08-issue-246-long-running-delivery.md

