name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs to save cost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-floor:
    name: dependency floors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Job-scoped suffix: setup-uv keys otherwise collide across
          # same-OS/same-Python jobs and the losers fail to save (README:
          # "the first job which starts uploading its cache will win").
          cache-suffix: ${{ github.job }}

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Qualify exact FastMCP and Pydantic floors from the built wheel
        run: >-
          uv run --project bin --locked pytest
          tests/test_install_manifests.py
          -k built_wheel_runs_at_declared_dependency_floors
          -q

      - name: Validate installed wheel against shipped skill contract
        run: >-
          uv run --project bin --locked pytest
          tests/test_release_artifact_contract.py
          -q

      - name: Qualify installed provider discovery across the Typer range
        run: >-
          uv run --project bin --locked pytest
          tests/test_installed_wheel.py
          -q

  windows-contracts:
    name: windows focused contracts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Job-scoped suffix: setup-uv keys otherwise collide across
          # same-OS/same-Python jobs and the losers fail to save (README:
          # "the first job which starts uploading its cache will win").
          cache-suffix: ${{ github.job }}

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Verify sample source-binding contract
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: >-
          uv run --project bin --locked --python 3.11 pytest
          tests/test_cli.py::TestSampleSourceBindingContract
          -q
          --basetemp "${{ runner.temp }}/anvil-source-binding"

      - name: Verify Git fixture contract in parallel
        run: >-
          uv run --project bin --locked --python 3.11 pytest
          tests/test_git_ops.py
          tests/test_reconciliation.py
          -n 16
          -q
          --basetemp "${{ runner.temp }}/anvil-git-fixture-contract"

      - name: Verify Windows timing-harness mechanics
        run: >-
          uv run --project bin --locked --python 3.11 pytest
          tests/test_windows_pytest_timing.py
          -q
          --basetemp "${{ runner.temp }}/anvil-timing-harness"

  test:
    name: test (python 3.11)
    runs-on: ubuntu-latest
    # Single version: requires-python = ">=3.11". Re-add 3.12 when you
    # actually target it (and fix the concurrency-test flake then).
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Job-scoped suffix: setup-uv keys otherwise collide across
          # same-OS/same-Python jobs and the losers fail to save (README:
          # "the first job which starts uploading its cache will win").
          cache-suffix: ${{ github.job }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Qualify native Responses and custom Chat Completions against the real
      # SDK using mock HTTP. These tests never require credentials or live calls.
      - name: Sync dependencies (OpenAI and custom extras)
        working-directory: bin
        run: uv sync --locked --extra openai --extra custom

      - name: Enforce repository-wide Ruff baseline
        working-directory: bin
        run: uv run --locked ruff check ..

      - name: Enforce total planning and scoring types
        run: >-
          uv run --project bin --locked mypy
          bin/src/anvil/mcp_server.py
          bin/src/anvil/planning/scoring.py
          bin/src/anvil/cli/plan.py

      - name: Run test suite in parallel
        env:
          # GitHub Actions sets GITHUB_ACTIONS=true which makes typer/rich
          # set FORCE_TERMINAL=True at import time, injecting ANSI codes into
          # CliRunner output. _TYPER_FORCE_DISABLE_TERMINAL overrides that so
          # --help assertions can match plain flag text (e.g. "--use-llm").
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run --project bin pytest -n auto

      # Coordination benchmark smoke: drives the real anvil CLI against
      # a live SQLite state engine. Uses the venv materialized by `uv sync`
      # above (the harness shells out to `uv run` / the synced CLI). Keep this
      # default-enforcing: --allow-invalid-results is for local report-only diagnosis.
      - name: Coordination benchmark smoke
        working-directory: bin
        run: uv run python ../benchmarks/run_benchmark.py --scenarios overlapping_files --quick

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Job-scoped suffix: setup-uv keys otherwise collide across
          # same-OS/same-Python jobs and the losers fail to save (README:
          # "the first job which starts uploading its cache will win").
          cache-suffix: ${{ github.job }}

      # Same command Read the Docs effectively runs (.readthedocs.yaml).
      # --strict: any broken relative link or anchor fails the build
      # (source-tree references use absolute GitHub URLs — see the
      # validation note in mkdocs.yml; plan item D5).
      - name: Build docs site
        run: uvx --with-requirements docs/requirements.txt mkdocs build --strict

  pi-sandbox:
    name: pi sandbox (image + unattended dogfood loop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Sync anvil CLI
        working-directory: bin
        run: uv sync --frozen --no-dev

      # Hermetic: policy/launcher contract (tree pins, staging, seed dir).
      - name: Sandbox launcher tests
        run: pytest tests/test_pi_sandbox.py -q

      # anvil-pi extension contract incl. per-verb flag contract against the
      # real CLI (dogfood-caused: packet rejects --json).
      - name: anvil-pi extension tests
        run: node tests/anvil_pi/extension.test.mjs

      # Build-time pin verification runs inside the Dockerfile; the build
      # FAILS if baked bytes drift from the allowlist pins.
      - name: Build sandbox image
        run: docker build -f packaging/pi/sandbox/Dockerfile -t anvil-pi-sandbox .

      # Dogfood: a fresh scratch anvil root + git repo; the container drives
      # status -> next -> claim -> packet -> submit unattended (mock provider,
      # network none). Assertions live OUTSIDE the agent, on host state.
      - name: Seed scratch anvil root
        run: |
          rm -rf /tmp/anvil-dogfood && mkdir -p /tmp/anvil-dogfood/ws
          cd /tmp/anvil-dogfood/ws
          git init -q . && git config user.email ci@anvil.local && git config user.name ci
          echo "# scratch" > README.md && git add -A && git commit -qm init
          cd "${{ github.workspace }}/bin"
          ANVIL_ROOT=/tmp/anvil-dogfood/ws ANVIL_STATE_LAYOUT=local uv run anvil init --with-sample

      - name: Run unattended loop in sandbox
        run: |
          printf 'You are driving the anvil work loop for this project unattended.\nUse the anvil tools: check status, pick the next claimable task, claim it, render its packet, and submit completion evidence.\nWhen the loop finishes, write a short markdown report to /work/report.md summarizing what each verb returned.\n' > /tmp/anvil-dogfood/task.txt
          scripts/pi-sandbox-docker.sh unattended-exec /tmp/anvil-dogfood/task.txt /tmp/anvil-dogfood/ws > /tmp/anvil-dogfood/run.log 2>&1 || {
            echo "::error::sandbox dogfood loop failed"; tail -40 /tmp/anvil-dogfood/run.log; exit 1; }
          grep -c '"type":"tool_execution_end"' /tmp/anvil-dogfood/run.log

      - name: Assert final state outside the agent
        run: |
          cd /tmp/anvil-dogfood/ws
          test -f report.md || { echo "::error::report.md missing"; exit 1; }
          test -f .anvil/packets/T001.json || { echo "::error::packet T001.json missing"; exit 1; }
          cd "${{ github.workspace }}/bin"
          ANVIL_ROOT=/tmp/anvil-dogfood/ws ANVIL_STATE_LAYOUT=local uv run anvil status --json > /tmp/anvil-dogfood/status.json
          python3 - << 'PY'
          import json, sys
          tasks = json.load(open("/tmp/anvil-dogfood/status.json"))["data"]["tasks"]
          assert tasks["needs_review"] == 1, f"expected T001 in needs_review, got {tasks}"
          assert tasks["done"] == 0, "apply is the human gate — the agent must not self-approve"
          print("dogfood state OK:", tasks)
          PY

      - name: Upload dogfood run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-sandbox-dogfood-log
          path: /tmp/anvil-dogfood/run.log
          if-no-files-found: ignore
