name: Python test partitions

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      windows_delivery:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  partition:
    name: shard ${{ matrix.shard }}/4
    runs-on: ${{ inputs.windows_delivery && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    steps:
      - name: Checkout exact test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: python-tests-${{ inputs.windows_delivery }}-${{ matrix.shard }}

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked test dependencies
        run: uv sync --project bin --locked --python 3.11 --extra openai --extra custom

      - name: Run full Linux partition
        if: ${{ !inputs.windows_delivery }}
        run: >-
          uv run --project bin --locked --python 3.11 pytest
          -n 4 --dist worksteal
          --anvil-test-shard ${{ matrix.shard }}/4
          --durations=30
          --junitxml "${{ runner.temp }}/pytest-results.xml"

      - name: Run Windows delivery partition
        if: inputs.windows_delivery
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: >-
          uv run --project bin --locked --python 3.11 pytest
          tests/test_verification_profiles.py
          tests/test_command_proof_artifact.py
          tests/test_proof_gate.py
          tests/test_profile_cli.py
          tests/test_profile_mcp.py
          tests/test_profile_live_boundaries.py
          tests/test_profile_roots.py
          tests/test_profile_workflows.py
          tests/test_attempt_view.py
          tests/test_attempt_timing.py
          tests/test_attempt_bundle.py
          tests/test_attempt_surfaces.py
          tests/test_attempt_surfaces_mcp.py
          tests/test_evidence_preflight_cli.py
          tests/test_evidence_preflight_mcp.py
          tests/test_evidence_preflight_common.py
          tests/test_timing_receipts.py
          tests/test_timing_ingestion.py
          tests/test_progress_cli.py
          tests/test_native_evidence_correction.py
          tests/test_surface_contract.py
          tests/test_long_running_delivery.py
          tests/test_long_running_installation.py
          tests/test_mcp_stdio.py
          tests/test_root_sets.py::test_enrollment_without_flock_refuses_before_owner_changes
          tests/test_root_sets.py::test_shared_json_reader_requires_bounded_regular_utf8
          tests/test_root_sets.py::test_mcp_root_lifecycle_refuses_without_changing_custody
          -n 4 --dist worksteal
          --anvil-test-shard ${{ matrix.shard }}/4
          --durations=30
          --junitxml "${{ runner.temp }}/pytest-results.xml"
          -q
          --basetemp "${{ runner.temp }}/anvil-long-running-contracts"

      - name: Retain test timings and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ runner.os }}-${{ inputs.windows_delivery }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: error
          retention-days: 14
